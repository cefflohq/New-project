name: cefflo_push
description: Closed-app alerts for the Cefflo Flutter apps. Web Push on web (bridges to shared/push/push.js), FCM on Android.
publish_to: none
version: 1.1.0
environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
