<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#01265E">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Cefflo Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./helper.css?v=20260928a">
</head>
<body>
<!-- Helper PWA (D-73): accountless Prepare -> Pack -> Ready for one
     business. Access is a server-issued secret passed once in the link
     fragment, kept on this device, and checked by helper_tasks /
     helper_advance_preparation on every call. No Vendor workspace. -->
<header class="bar">
  <div class="bar-name" id="barName"><b>Cefflo</b> <span>Helper</span></div>
  <div class="bar-sub" id="barSub"></div>
</header>
<main class="sheet">
  <div id="stLoading" class="state"><div class="ring" aria-hidden="true"></div><p>Loading your tasks…</p></div>

  <div id="stTasks" hidden>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <ul class="tasks" id="taskList"></ul>
    <div id="stEmpty" class="state empty" hidden>
      <div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/></svg></div>
      <h1>Nothing to prepare</h1>
      <p id="emptyText">New orders will appear here.</p>
    </div>
    <button class="refresh" id="refreshBtn" type="button">Refresh</button>
  </div>

  <div id="stNoAccess" class="state" hidden>
    <div class="warn" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg></div>
    <h1 id="noAccessTitle">Access removed</h1>
    <p id="noAccessBody">This Helper workspace link no longer works. Ask the business owner to share a new link.</p>
  </div>

  <div id="stError" class="state" hidden>
    <div class="warn" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg></div>
    <h1>Can’t load tasks</h1>
    <p>Check your connection and try again.</p>
    <button class="cta" id="retryBtn" type="button">Try again</button>
  </div>
</main>
<script src="../shared/config.js?v=20260928b"></script>
<script src="../shared/client.js?v=20260829a"></script>
<script src="./app.js?v=20260928a"></script>
</body>
</html>
