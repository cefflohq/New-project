<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#01265E">
<meta name="robots" content="noindex">
<title>Cefflo Storefront</title>
<link rel="stylesheet" href="/store/store.css?v=20261001c">
</head>
<body>
<!-- Cefflo Storefront V1 (STAGING proof of the slug architecture).
     /{slug} -> public_storefront(slug) -> catalogue from the business's own
     Products -> submit_storefront_order -> a real Cefflo order. -->
<header class="top" id="top">
  <h1 id="bizName">Cefflo</h1>
  <p id="bizMeta"></p>
</header>
<main id="app">
  <p class="state" id="state">Loading…</p>
  <section id="catalogue" hidden></section>
  <section id="checkout" class="sheet" hidden>
    <h2>Your order</h2>
    <ul id="cartLines"></ul>
    <p class="total">Total <b id="cartTotal">RM 0.00</b></p>
    <label>Name<input id="cName" autocomplete="name" maxlength="120"></label>
    <label>Phone<input id="cPhone" autocomplete="tel" inputmode="tel" maxlength="30"></label>
    <label>Delivery address<textarea id="cAddress" rows="3" maxlength="500"></textarea></label>
    <label>Notes (optional)<textarea id="cNotes" rows="2" maxlength="500"></textarea></label>
    <p class="error" id="formError" hidden></p>
    <button class="cta" id="placeOrder" type="button">Place order</button>
  </section>
  <section id="done" class="sheet" hidden>
    <h2>Order received</h2>
    <p>Your order reference is <b id="orderRef"></b>.</p>
    <p class="muted">The business will confirm your order.</p>
  </section>
</main>
<footer class="bar" id="bar" hidden>
  <span id="barCount"></span>
  <button class="cta" id="toCheckout" type="button">Checkout</button>
</footer>
<script src="/shared/config.js?v=20261001a"></script>
<script src="/store/store.js?v=20261001c"></script>
</body>
</html>
