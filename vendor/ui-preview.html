<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>CEFFLO Vendor UI Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#7861f3;--ink:#171522;--muted:#777987;--line:#ecebf1;--soft:#f6f5f9;--white:#fff;--danger:#d9505b}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font-family:Poppins,sans-serif}
    button{font:inherit}
    .app{width:100%;max-width:430px;min-height:100dvh;margin:auto;background:#fff;padding-bottom:calc(82px + env(safe-area-inset-bottom))}
    .preview-note{padding:8px 16px;background:#f1eefe;color:#5e48cf;font-size:11px;font-weight:600;text-align:center}
    .page{display:none}.page.active{display:block;animation:rise .45s cubic-bezier(.16,1,.3,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .header{height:64px;padding:0 16px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border-bottom:1px solid var(--line)}
    .header h1{margin:0;text-align:center;font-size:18px}.icon{width:40px;height:40px;border:0;background:transparent;font-size:22px;color:var(--ink)}
    main{padding:16px}.section{margin-bottom:22px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
    .section-head h2{margin:0;font-size:15px}.section-head button{border:0;background:none;color:var(--primary);font-size:12px;font-weight:600}
    .card{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 5px 18px rgba(30,23,65,.055)}
    .summary{padding:16px;background:linear-gradient(145deg,#806af4,#684fe0);color:#fff;border:0}.live{font-size:10px;font-weight:700;letter-spacing:.06em}.live::before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:#7df0ae}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);margin-top:16px}.kpi{text-align:center;border-right:1px solid rgba(255,255,255,.2)}.kpi:last-child{border:0}.kpi b{display:block;font-size:20px}.kpi span{font-size:10px;opacity:.82}
    .list{display:grid;gap:10px}.delivery{min-height:68px;padding:12px 14px;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left}
    .avatar,.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#eeeafe;color:#684fe0;font-size:12px;font-weight:700}.delivery b{font-size:13px}.delivery small{display:block;margin-top:3px;color:var(--muted);font-size:10.5px}.chip{padding:5px 8px;border-radius:99px;background:#eeeafe;color:#654ddd;font-size:8.5px;font-weight:700}
    .action{min-height:56px;padding:0 14px;display:grid;grid-template-columns:34px 1fr 18px;align-items:center;gap:10px;text-align:left}.action+.action{margin-top:10px}.action .alert{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#fff0f1;color:var(--danger)}.action b{font-size:11.5px;font-weight:600}.chev{color:#aaa;font-size:20px}
    .profile{padding:16px;display:grid;grid-template-columns:52px 1fr 36px;gap:12px;align-items:center;border-radius:18px}.profile .logo{width:52px;height:52px;border-radius:16px;background:var(--primary);color:#fff}.profile h2{margin:0;font-size:15px}.profile p{margin:3px 0;color:var(--muted);font-size:11px}.verified{color:#5d48ce;font-size:9.5px;font-weight:600}.edit{width:36px;height:36px;border:0;border-radius:11px;background:var(--soft);color:var(--primary)}
    .settings-card{overflow:hidden}.settings-row{width:100%;min-height:56px;padding:0 14px;border:0;border-bottom:1px solid var(--line);background:#fff;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left}.settings-row:last-child{border-bottom:0}.row-icon{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--soft);color:var(--primary)}.settings-row b{font-size:12.5px}.tail{color:var(--muted);font-size:11px}.toggle{width:40px;height:23px;padding:3px;border-radius:99px;background:var(--primary)}.toggle::after{content:"";display:block;width:17px;height:17px;margin-left:17px;border-radius:50%;background:#fff}
    .signout{width:100%;height:50px;border:1px solid #f0dfe1;border-radius:14px;background:#fff8f8;color:var(--danger);font-weight:600}.build{text-align:center;margin-top:18px;color:#aaa;font-size:10px}
    .bottom-nav{position:fixed;z-index:5;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;height:calc(68px + env(safe-area-inset-bottom));padding:7px 26px env(safe-area-inset-bottom);display:flex;justify-content:space-around;border-top:1px solid var(--line);background:#fff}
    .nav{min-width:72px;border:0;background:none;color:#999;font-size:10px}.nav i{display:block;font-style:normal;font-size:21px;line-height:26px}.nav.active{color:var(--primary);font-weight:600}
    @media(prefers-reduced-motion:reduce){.page.active{animation:none}}
  </style>
</head>
<body>
  <div class="app">
    <div class="preview-note">UI PREVIEW ONLY · NO BACKEND CONNECTION</div>
    <section class="page active" id="dashboard">
      <header class="header"><button class="icon" aria-label="Menu">☰</button><h1>Dapur Bonda</h1><button class="icon" aria-label="Notifications">♢</button></header>
      <main>
        <section class="section"><div class="card summary"><div class="live">LIVE</div><div class="kpis"><div class="kpi"><b>12</b><span>Orders</span></div><div class="kpi"><b>6</b><span>Riders</span></div><div class="kpi"><b>2</b><span>Issues</span></div><div class="kpi"><b>75%</b><span>Completed</span></div></div></div></section>
        <section class="section"><div class="section-head"><h2>Current Deliveries</h2><button>See All</button></div><div class="list">
          <button class="card delivery"><span class="avatar">AH</span><span><b>Aiman Hakim</b><small>#CF-1024 · Zone A</small></span><span class="chip">ON THE WAY</span></button>
          <button class="card delivery"><span class="avatar">SN</span><span><b>Siti Nor A.</b><small>#CF-1025 · Zone B</small></span><span class="chip">PICKED UP</span></button>
        </div></section>
        <section class="section"><div class="section-head"><h2>Action Required</h2></div><button class="card action"><span class="alert">!</span><b>CF-0127 has a delivery issue reported</b><span class="chev">›</span></button><button class="card action"><span class="alert">!</span><b>Rider Farid Aziz is offline in Zone D</b><span class="chev">›</span></button></section>
      </main>
    </section>
    <section class="page" id="settings">
      <header class="header"><button class="icon" data-page="dashboard" aria-label="Back">‹</button><h1>Settings</h1><button class="icon" aria-label="Notifications">♢</button></header>
      <main>
        <section class="section"><div class="card profile"><div class="logo">DB</div><div><h2>Dapur Bonda</h2><p>Home Food Vendor</p><span class="verified">✓ Verified Vendor</span></div><button class="edit" aria-label="Edit">✎</button></div></section>
        <section class="section"><div class="card settings-card">
          <div class="settings-row"><span class="row-icon">☾</span><span><b>Dark Mode</b></span><span class="toggle"></span></div>
          <div class="settings-row"><span class="row-icon">♢</span><span><b>Notifications</b></span><span class="toggle"></span></div>
          <button class="settings-row"><span class="row-icon">◎</span><span><b>Language</b></span><span class="tail">English ›</span></button>
          <button class="settings-row"><span class="row-icon">♙</span><span><b>Team</b></span><span class="chev">›</span></button>
          <button class="settings-row"><span class="row-icon">▣</span><span><b>Subscription Plan</b></span><span class="chev">›</span></button>
          <button class="settings-row"><span class="row-icon">?</span><span><b>Help & Support</b></span><span class="chev">›</span></button>
          <button class="settings-row"><span class="row-icon">ⓘ</span><span><b>About CEFFLO</b></span><span class="chev">›</span></button>
        </div></section>
        <button class="signout">Sign Out</button><div class="build">CEFFLO v1.2.0</div>
      </main>
    </section>
    <nav class="bottom-nav"><button class="nav active" data-page="dashboard"><i>⌂</i>Home</button><button class="nav" data-page="settings"><i>⚙</i>Settings</button></nav>
  </div>
  <script>
    document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{
      const target=button.dataset.page;
      document.querySelectorAll('.page').forEach(page=>page.classList.toggle('active',page.id===target));
      document.querySelectorAll('.nav').forEach(nav=>nav.classList.toggle('active',nav.dataset.page===target));
      scrollTo({top:0,behavior:'smooth'});
    }));
  </script>
</body>
</html>
