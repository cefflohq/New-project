<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Zooming stays enabled: pinch-zoom is an accessibility affordance. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03265E">
  <meta name="description" content="Track your delivery.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex, nofollow">
  <title>Track your delivery</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=20261003l">
</head>
<body>
  <div class="app" id="app">
    <main class="sheet" id="sheet" aria-label="Delivery tracking"></main>
  </div>
  <div id="overlayRoot"></div>

  <script>
    // The real Cefflo Core Backend caller (customer/backend.js) is loaded only
    // for a tokenised tracking link. The prototype entry point runs on the
    // centralised mock fixtures instead, so no backend call or provider
    // connection is fabricated.
    (function () {
      if (!new URLSearchParams(location.search).get('token')) return;
      window.CEFFLO_SESSION_KEY = 'cefflo_customer_auth_session';
      ['../shared/config.js?v=20260916a', '../shared/client.js?v=20260916a', './live.js?v=20260927a', './backend.js?v=20260927a'].forEach(function (src) {
        var script = document.createElement('script');
        script.src = src;
        script.async = false; // preserve execution order and keep blocking `load`
        document.head.appendChild(script);
      });
    })();
  </script>

  <script type="module" src="./app.js?v=20261003l"></script>

  <script>
    if ('serviceWorker' in navigator) {
      var customDomain = location.hostname === 'tracking.cefflo.com';
      var workerUrl = customDomain ? '/sw.js' : './sw.js';
      var workerScope = customDomain ? '/' : './';
      window.addEventListener('load', function () {
        navigator.serviceWorker.register(workerUrl, { scope: workerScope })
          .catch(function (error) { console.warn('CEFFLO Customer service worker unavailable:', error); });
      });
    }
  </script>
</body>
</html>
