<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CEFFLO Vendor Auth</title>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@500;700&family=Noto+Sans+Tamil:wght@500;700&display=swap">
<style>
  :root{
    --navy-deep:#0A1730; --navy:#12213E; --navy-lift:#1E4585;
    --yellow:#FEC819;
    --ink:#12213E; --ink-muted:#5C647A; --ink-faint:#98A0B3;
    --surface:#FFFFFF; --field-border:#E1E5EE; --attention:#D73C2B;
    --disabled-fill:#E6E8EE; --disabled-ink:#9AA0B4;
    --stage:#161B26;
    --sheet-radius:28px; --btn-radius:14px; --btn-h:54px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  /* No height:100% on html/body — inside an auto-sized frame that resolves
     against a zero-height ancestor and collapses the page to nothing. */
  body{
    margin:0; min-height:100dvh; background:var(--stage); color:var(--ink);
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  .device{
    position:relative; padding:13px; border-radius:54px;
    background:linear-gradient(160deg,#39414f,#1b2029 45%,#333b48);
    box-shadow:0 26px 60px rgba(0,0,0,.55), 0 0 0 1px #0b0e14;
  }
  .screen{
    width:390px; height:844px; border-radius:42px; overflow:hidden;
    position:relative; background:var(--navy);
  }
  .island{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    width:104px; height:28px; border-radius:16px; background:#000; z-index:40;
    pointer-events:none;
  }
  @media (max-width:560px), (max-height:920px){
    .device{padding:0; border-radius:0; background:none; box-shadow:none}
    .screen{width:100vw; height:100dvh; min-height:540px; border-radius:0}
    .island{display:none}
  }

  .app{position:absolute; inset:0; overflow:hidden}
  .backdrop{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 95% 95% at 47% 44%, rgba(47,107,208,.20), rgba(0,0,0,0) 70%),
      linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 34%, var(--navy-lift) 66%, var(--navy) 100%);
  }
  .pane{position:absolute; inset:0; display:flex; flex-direction:column}
  .lockup{display:block; object-fit:contain; margin:0 auto}
  .lockup.soft{filter:blur(3.2px)}

  .backrow{height:44px; display:flex; align-items:center; padding-left:8px; flex:0 0 auto}
  .backbtn{
    display:flex; align-items:center; gap:4px; background:none; border:0;
    color:#fff; font:700 17px 'Manrope',sans-serif; padding:8px 10px; cursor:pointer;
    font-family:inherit;
  }
  .header{flex:0 0 auto; position:relative; overflow:hidden}

  /* The sheet hugs its own content instead of filling every screen to the
     same height: this spacer takes whatever is left over, so a short screen
     shows more Navy and a long one pushes the sheet up. When content
     outgrows the screen the spacer collapses first and the sheet scrolls. */
  .spacer{flex:1 1 0; min-height:0}
  /* Sheet screens scroll as one page. Letting the card scroll inside a fixed
     frame clipped it at both ends — the title was sliced by the card's top
     edge and the CTA fell past the bottom of the screen. The gradient lives
     on this element so it covers the whole scrollable run. */
  .pane.flow{
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:
      radial-gradient(ellipse 95% 95% at 47% 30%, rgba(47,107,208,.20), rgba(0,0,0,0) 70%),
      linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 34%, var(--navy-lift) 66%, var(--navy) 100%);
  }
  /* Holds the header lockup centred in whatever Navy the sheet leaves. */
  .brandarea{
    flex:1 1 auto; min-height:96px; position:relative; z-index:1;
    display:flex; align-items:center; justify-content:center;
    padding:8px 24px 22px;
  }
  /* Scales down when the Navy area is squeezed, instead of sliding under the
     card and showing half a wordmark. object-fit keeps it undistorted. */
  .brandarea .lockup{max-height:100%}
  /* Sign In is one scrolling column; nothing in it may be compressed to make
     room. The column scrolls instead. */
  .signin-col > *{flex-shrink:0}
  /* Never shrinks: it is always exactly as tall as its content, and the pane
     scrolls when that no longer fits. */
  .sheet{
    flex:0 0 auto; position:relative; z-index:1;
    background:var(--surface);
    border-radius:var(--sheet-radius) var(--sheet-radius) 0 0;
    /* Generous bottom padding: the host chrome eats height, and without it
       the primary CTA sits right on the edge of the fold. */
    padding:18px 24px 44px;
    animation:rise .26s cubic-bezier(.2,.8,.25,1);
  }
  @keyframes rise{from{transform:translateY(14px); opacity:.4} to{transform:none; opacity:1}}
  .grab{width:44px; height:4px; border-radius:99px; background:#D7DAE2; margin:0 auto 20px}

  h1.title{margin:0; font-size:26px; line-height:1.2; font-weight:800; color:var(--ink); text-align:center; text-wrap:balance}
  h1.title.left{text-align:left}
  p.sub{margin:6px 0 0; font-size:15.5px; line-height:1.4; font-weight:500; color:var(--ink-muted); text-align:center; white-space:pre-line}
  p.sub.left{text-align:left}
  p.note{margin:0; font-size:15.5px; line-height:1.45; font-weight:500; color:var(--ink-muted); text-align:center}
  p.note.faint{font-size:14.5px; color:var(--ink-faint)}

  /* flex:0 0 auto is load-bearing: a fixed `height` does not stop a flex
     child from being compressed, so inside the scrolling Sign In column the
     buttons were squashed well under 54px once content outgrew the screen. */
  .btn{
    width:100%; height:var(--btn-h); flex:0 0 auto;
    border-radius:var(--btn-radius); border:0;
    font:800 16.5px 'Manrope',sans-serif; font-family:inherit; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    transition:filter .12s, transform .06s;
  }
  .btn:active:not(:disabled){transform:scale(.985)}
  .btn.primary{background:var(--yellow); color:var(--ink)}
  .btn.primary:disabled{background:var(--disabled-fill); color:var(--disabled-ink); cursor:default}
  .btn.primary.busy:disabled{background:var(--yellow); color:var(--ink)}
  .btn.outline{background:transparent; color:var(--ink); border:1.4px solid var(--navy); font-weight:700}
  .btn.outline:disabled{border-color:var(--field-border); color:var(--disabled-ink); cursor:default}
  .btn.provider{background:#fff; color:#111; font-weight:700}
  .btn.provider.filled{background:var(--yellow); color:var(--ink)}
  .btn:focus-visible{outline:3px solid rgba(254,200,25,.65); outline-offset:2px}

  .spinner{
    width:19px; height:19px; border-radius:50%;
    border:2.4px solid rgba(18,33,62,.25); border-top-color:var(--ink);
    animation:spin .7s linear infinite; flex:0 0 auto;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .link{
    background:none; border:0; padding:0; cursor:pointer; font-family:inherit;
    color:var(--ink); font-size:15px; font-weight:800; text-decoration:underline;
  }
  .link.on-navy{color:#fff; text-decoration-color:#fff}
  .prompt{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px; font-size:15px; font-weight:500; color:var(--ink-muted)}
  .prompt.on-navy{color:rgba(255,255,255,.82)}

  .field label{display:block; font-size:14.5px; font-weight:700; color:var(--ink); margin-bottom:6px}
  .field .box{
    display:flex; align-items:center; gap:10px; background:#fff;
    border:1.2px solid var(--field-border); border-radius:var(--btn-radius);
    padding:0 12px; height:56px; transition:border-color .14s;
  }
  .field .box:focus-within{border-color:var(--navy); border-width:1.4px}
  .field.err .box{border-color:var(--attention); border-width:1.4px}
  .field input{flex:1 1 auto; min-width:0; border:0; outline:0; background:none; font:400 16px 'Manrope',sans-serif; font-family:inherit; color:var(--ink)}
  .field input::placeholder{color:var(--ink-faint)}
  .field .eye{background:none; border:0; padding:4px; cursor:pointer; color:var(--ink-muted); display:flex}
  .field .msg{margin:6px 0 0; font-size:13.5px; line-height:1.35; font-weight:500; color:var(--ink-muted)}
  .field .msg.err{color:var(--attention); font-weight:600}

  .ring{width:76px; height:76px; border-radius:50%; border:2px solid var(--navy); display:grid; place-items:center; margin:0 auto}
  .disc{width:88px; height:88px; border-radius:50%; background:var(--yellow); display:grid; place-items:center; margin:0 auto}
  .bare{text-align:center}

  .divider{display:flex; align-items:center; gap:14px; color:rgba(255,255,255,.82); font-size:14.5px; font-weight:600}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:rgba(255,255,255,.28)}

  .progress{display:flex; justify-content:center; gap:6px}
  .progress i{width:56px; height:4px; border-radius:99px; background:rgba(255,255,255,.28); transition:background .2s}
  .progress i.lit{background:var(--yellow)}

  .lang{
    display:flex; align-items:center; gap:14px; width:100%;
    border:1.2px solid var(--field-border); border-radius:var(--btn-radius);
    background:#fff; padding:11px 12px; cursor:pointer; font-family:inherit;
    transition:border-color .14s; margin-bottom:10px;
  }
  .lang.on{border-color:var(--navy); border-width:1.8px}
  .lang .badge{width:34px; height:34px; border-radius:50%; background:#EFF2F7; display:grid; place-items:center; font-size:13px; font-weight:800; color:var(--ink); flex:0 0 auto}
  .lang .name{flex:1 1 auto; text-align:left; font-size:16.5px; font-weight:700; color:var(--ink)}
  .lang .radio{width:22px; height:22px; border-radius:50%; border:1.6px solid #D3D9E4; flex:0 0 auto}
  .han{font-family:'Noto Sans SC','Manrope',sans-serif}
  .tamil{font-family:'Noto Sans Tamil','Manrope',sans-serif}

  .scrim{position:absolute; inset:0; background:rgba(8,14,26,.5); z-index:30; display:flex; align-items:flex-end; animation:fade .2s}
  @keyframes fade{from{opacity:0} to{opacity:1}}
  .modal{
    width:100%; background:var(--surface); border-radius:var(--sheet-radius) var(--sheet-radius) 0 0;
    padding:14px 24px 24px; max-height:86%; overflow-y:auto;
    animation:slideup .28s cubic-bezier(.2,.8,.25,1);
  }
  @keyframes slideup{from{transform:translateY(100%)} to{transform:none}}

  /* Top-right, over the navy header. It sat bottom-right before and covered
     the primary CTA on every sheet screen — the one control you most need to
     press. Up here it overlaps only empty backdrop. */
  .indexbtn{
    position:absolute; right:12px; top:9px; z-index:25;
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.22);
    border-radius:99px; padding:7px 12px;
    font:700 12.5px 'Manrope',sans-serif; font-family:inherit;
    cursor:pointer; backdrop-filter:blur(6px);
  }
  .idxrow{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    background:none; border:0; padding:11px 0; cursor:pointer; font-family:inherit;
    font-size:15px; font-weight:600; color:var(--ink-muted); text-align:left;
    border-bottom:1px solid #F0F2F7;
  }
  .idxrow.on{color:var(--navy); font-weight:800}

  .toast{
    position:absolute; left:16px; right:16px; bottom:80px; z-index:50;
    background:var(--navy-deep); color:#fff; border-radius:12px;
    padding:13px 15px; font-size:13.5px; font-weight:600; line-height:1.4;
    box-shadow:0 10px 26px rgba(0,0,0,.4); animation:fade .2s;
  }
  .fatal{
    position:absolute; inset:0; z-index:99; background:#12213E; color:#fff;
    padding:24px; font-size:13px; line-height:1.5; overflow:auto;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>
<div class="device">
  <div class="island"></div>
  <div class="screen"><div class="app" id="app"></div></div>
</div>

  function icon(name, size, color, stroke) {

  /* -------- brand -------- */
  // height is the VISIBLE lockup height; the D-35 asset is a square canvas
  // whose mark fills 72.25% of it. Same constant the Flutter build uses.
  function lockup(height, soft) {
    var box = height / 0.7225;
    return el("img", {
      src: LOGO, alt: "CEFFLO", class: "lockup" + (soft ? " soft" : ""),
      style: { height: box + "px", width: box + "px" }
    });
  }
  function tagline() {
    return el("p", {
      text: "Operate Today.\nGrow Tomorrow.",
      style: {
        margin: "0", textAlign: "center", color: "rgba(255,255,255,.88)",

      }
    });
  }

  /* -------- controls -------- */
  function primary(label, onClick, opts) {
    opts = opts || {};
    var b = el("button", { class: "btn primary", onclick: onClick });
    b.setLabel = function (text, busy) {
      b.innerHTML = "";
      b.disabled = !!busy || !!b._off;
      b.className = "btn primary" + (busy ? " busy" : "");
      if (busy) b.appendChild(el("span", { class: "spinner" }));
      b.appendChild(document.createTextNode(text));
    };
    b.setEnabled = function (on) { b._off = !on; b.disabled = !on; };
    b.setLabel(label, false);
    if (opts.disabled) b.setEnabled(false);
    return b;
  }
  function outline(label, onClick) {
    return el("button", { class: "btn outline", onclick: onClick }, label);
  }
  function link(label, onClick, onNavy) {
    return el("button", { class: "link" + (onNavy ? " on-navy" : ""), onclick: onClick }, label);
  }
  function title(t, sub, left) {
    return el("div", null,
      el("h1", { class: "title" + (left ? " left" : ""), text: t }),
      sub ? el("p", { class: "sub" + (left ? " left" : ""), text: sub }) : null);
  }
  function prompt(question, action, onClick, onNavy) {
    return el("div", { class: "prompt" + (onNavy ? " on-navy" : "") },
      el("span", { text: question }), link(action, onClick, onNavy));
  }

  function field(opts) {
    var wrap = el("div", { class: "field" });
    var input = el("input", {
      type: opts.secret ? "password" : (opts.type || "text"),
      placeholder: opts.hint, value: opts.value || "",
      autocomplete: "off", autocapitalize: "none", spellcheck: "false"
    });
    if (opts.oninput) input.addEventListener("input", function () { opts.oninput(input.value); });
    var box = el("div", { class: "box" }, icon(opts.icon, 21, "var(--ink)"), input);
    if (opts.secret) {
      var shown = false;
      var eye = el("button", { class: "eye", "aria-label": "Show password" });
      eye.appendChild(icon("eye", 21, "currentColor"));
      eye.addEventListener("click", function () {
        shown = !shown;
        input.type = shown ? "text" : "password";
        eye.innerHTML = "";
        eye.appendChild(icon(shown ? "eyeOff" : "eye", 21, "currentColor"));
      });
      box.appendChild(eye);
    }
    var msg = el("p", { class: "msg" });
    wrap.appendChild(el("label", { text: opts.label }));
    wrap.appendChild(box);
    wrap.appendChild(msg);
    wrap.setMsg = function (text, isError) {
      msg.textContent = text || "";
      msg.className = "msg" + (isError ? " err" : "");
      msg.style.display = text ? "" : "none";
      wrap.className = "field" + (isError ? " err" : "");
    };
    wrap.value = function () { return input.value; };
    wrap.setMsg(opts.error || opts.helper, !!opts.error);
    return wrap;
  }

  var ring = function (n) { return el("div", { class: "ring" }, icon(n, 34, "var(--navy)")); };
  var bare = function (n) { return el("div", { class: "bare" }, icon(n, 62, "var(--navy)")); };
  var disc = function () { return el("div", { class: "disc" }, icon("check", 44, "var(--ink)", 2.6)); };

  /* -------- sheet scaffold -------- */
  var HEADER_LOCKUP = 128;
  function sheet(onBack, handle, kids) {
    var backRow = el("div", { class: "backrow" });
    if (onBack) {
      var b = el("button", { class: "backbtn", onclick: onBack });
      b.appendChild(icon("chevL", 22, "#fff"));
      b.appendChild(document.createTextNode("Back"));
      backRow.appendChild(b);
    }
    // The backdrop now spans the whole pane rather than a fixed header band,
    // because the Navy area is no longer a fixed height — it is whatever the
    // sheet leaves behind. The lockup centres itself in that leftover space
    // instead of pinning under the back row, which left a large dead gap on
    // short screens.
    var brandArea = el("div", { class: "brandarea" }, lockup(HEADER_LOCKUP, true));
    var body = el("div", { class: "sheet" });
    if (handle) body.appendChild(el("div", { class: "grab" }));
    kids.forEach(function (k) { if (k) body.appendChild(k); });
    // No absolute backdrop child here — the gradient is painted by .pane.flow
    // so it follows the full scroll height rather than one viewport.
    return el("div", { class: "pane flow" },
      el("div", { style: { position: "relative", zIndex: "1", flex: "0 0 auto" } }, backRow),
      brandArea,
      body);
  }

  /* ================= screens ================= */
  var LANGS = [
    ["English", "en", "globe"],
    ["Bahasa Melayu", "ms", "BM"],
    ["中文 (简体)", "zh", "中"],
    ["தமிழ்", "ta", "த"]
  ];
  var ERRORS = {
    invalid: "Email or password is incorrect. Try again.",
    connection: "Unable to connect. Check your connection and try again.",
    rate: "Too many attempts. Please wait before trying again."
  };

  var state = { stack: ["splash"], language: "English" };
  var timers = [];
  function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function go(s) { state.stack.push(s); render(); }
  function replace(s) { state.stack = [s]; render(); }
  function back() { if (state.stack.length > 1) state.stack.pop(); else state.stack = ["signIn"]; render(); }
  var toSignIn = function () { replace("emailSignIn"); };

  function toast(text) {
    var t = el("div", { class: "toast", text: text });
    app.appendChild(t);
    later(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2600);
  }

  /* ---- 01 Splash ---- */
  function splash() {
    var bars = [0, 1, 2].map(function () { return el("i"); });
    var prog = el("div", { class: "progress" }, bars);
    var lit = 0;
    bars[0].className = "lit";
    var iv = setInterval(function () {
      bars[lit].className = "";
      lit = (lit + 1) % 3;
      bars[lit].className = "lit";
    }, 470);
    timers.push(iv);
    later(function () { clearInterval(iv); replace("signIn"); }, 2200);
    return el("div", { class: "pane" },
      el("div", { class: "backdrop" }),
      el("div", {
        style: {
          position: "relative", zIndex: "1", flex: "1", display: "flex",
          flexDirection: "column", alignItems: "center", padding: "0 24px 34px"
        }
      },
        el("div", { style: { flex: "5" } }),
        lockup(200, false),
        el("p", {
          text: "Vendor",
          style: {
            margin: "6px 0 0", color: "rgba(255,255,255,.92)",
            fontSize: "21px", fontWeight: "500", letterSpacing: ".2px"
          }
        }),
        el("div", { style: { flex: "5" } }),
        tagline(), gap(28), prog));
  }

  /* ---- 02 Sign In ---- */
  function signIn() {
    var pill = el("button", {
      onclick: function () { languageModal(); },

      }
    });

    pill.appendChild(document.createTextNode(state.language));
    pill.appendChild(icon("chevD", 19, "#fff"));

    function provider(label, glyph, filled, onClick) {
      var b = el("button", { class: "btn provider" + (filled ? " filled" : ""), onclick: onClick });

        el("h1", {
          text: "Welcome back",
          style: { margin: "0", textAlign: "center", color: "#fff", fontSize: "25px", fontWeight: "800" }
        }),
        el("p", {
          text: "Sign in to manage your deliveries today.",

  /* ---- 03 Email Sign In + states ---- */
  function emailSignIn(mode) {
    mode = mode || "idle";
    var seeded = mode !== "idle";
    var email = field({
      label: "Email", hint: "you@yourbusiness.com", icon: "mail",
      value: seeded ? "someone@cefflo.test" : "", type: "email"
    });
    var pw = field({
      label: "Password", hint: "Enter your password", icon: "lock",
      value: seeded ? "hunter2hunter2" : "", secret: true, error: ERRORS[mode]
    });
    var cta = primary(mode === "connection" ? "Try again" : "Sign In", function () {
      cta.setLabel("Signing in…", true);
      // Auth-only scope: no "signed in" screen is locked, so the honest demo
      // end-state is the locked failure the boards do define.
      later(function () {
        cta.setLabel("Sign In", false);
        pw.setMsg(ERRORS.invalid, true);
      }, 1400);
    });
    if (mode === "rate") cta.setEnabled(false);
    return sheet(back, true, [
      title("Sign in with Email", "Enter your email and password to continue."),
      gap(20), email, gap(14), pw, gap(10),
      el("div", { style: { display: "flex", justifyContent: "flex-end" } },
        link("Forgot password?", function () { go("forgot"); })),
      gap(20), cta, gap(20),
      prompt("Don't have an account?", "Sign up", function () { go("signUp"); })
    ]);
  }

  /* ---- 04 Create Account ---- */
  function signUp() {
    var email = field({ label: "Email", hint: "you@yourbusiness.com", icon: "mail", type: "email" });
    var pw = field({ label: "Password", hint: "Enter your password", icon: "lock", secret: true, helper: "Use at least 8 characters." });
    var cf = field({
      label: "Confirm password", hint: "Confirm your password", icon: "lock", secret: true,
      oninput: function () { cf.setMsg("", false); }
    });
    var cta = primary("Create account", function () {
      if (pw.value() !== cf.value()) { cf.setMsg("Passwords must match.", true); return; }
      cta.setLabel("Creating…", true);
      later(function () { go("verify"); }, 1200);
    });
    return sheet(back, false, [
      title("Create your account", "Start managing your deliveries.", true),
      gap(20), email, gap(14), pw, gap(14), cf, gap(20), cta, gap(20),
      prompt("Already have an account?", "Sign in", toSignIn)
    ]);
  }

  /* ---- 05 Forgot Password ---- */
  function forgot() {
    var email = field({ label: "Email", hint: "you@yourbusiness.com", icon: "mail", type: "email" });
    var cta = primary("Send reset link", function () {
      cta.setLabel("Sending…", true);
      later(function () { go("checkEmail"); }, 1200);
    });
    return sheet(back, false, [
      title("Forgot password?", "Enter your email and we'll send you a reset link."),
      gap(20), email, gap(20), cta, gap(20),
      el("div", { style: { textAlign: "center" } }, link("Back to sign in", toSignIn))
    ]);
  }

  /* ---- 06 Check Your Email ---- */
  function checkEmail() {
    return sheet(back, false, [
      gap(6), bare("mail"), gap(20),
      title("Check your email", "If an account exists for this email, you'll receive a password reset link."),
      gap(14), el("p", { class: "note faint", text: "Check your spam folder too." }),
      gap(28), primary("Back to sign in", toSignIn), gap(10),
      outline("Try another email", function () { replace("forgot"); })
    ]);
  }

  /* ---- 07 Set a New Password ---- */
  function setNew(seedMismatch) {
    var pw = field({
      label: "New password", hint: "Enter your new password", icon: "lock", secret: true,
      value: seedMismatch ? "deliverfast1" : "", helper: "Use at least 8 characters.",
      oninput: function () { sync(); }
    });
    var cf = field({
      label: "Confirm new password", hint: "Confirm your new password", icon: "lock", secret: true,
      value: seedMismatch ? "deliverfast2" : "",
      // The board carries this as a standing requirement, and turns it red
      // once the two fields actually disagree.
      helper: seedMismatch ? null : "Passwords must match.",
      error: seedMismatch ? "Passwords must match." : null,
      oninput: function () { cf.setMsg("Passwords must match.", false); sync(); }
    });
    var cta = primary("Update password", function () {
      cta.setLabel("Updating…", true);
      later(function () { replace("updated"); }, 1200);
    });
    function sync() { cta.setEnabled(pw.value().length > 0 && pw.value() === cf.value()); }
    sync();
    return sheet(back, false, [
      title("Set a new password", "Choose a strong password for your account."),
      gap(20), pw, gap(14), cf, gap(20), cta
    ]);
  }

  /* ---- 08 Password Updated ---- */
  function updated() {
    return sheet(back, false, [
      gap(10), disc(), gap(20),
      title("Password updated", "Your password has been successfully changed."),
      gap(20), el("p", { class: "note", text: "You can now sign in with your new password." }),
      gap(28), primary("Continue to sign in", toSignIn)
    ]);
  }

  /* ---- 10 Verify Your Email ---- */
  function verify(seedSending) {
    var alt = outline("Use a different email", function () { replace("signUp"); });
    var cta = primary("Resend verification email", function () { send(); });
    function send() {
      cta.setLabel("Sending…", true);
      alt.disabled = true;
      later(function () {
        cta.setLabel("Resend verification email", false);
        alt.disabled = false;
      }, 1600);
    }
    if (seedSending) later(send, 30);
    return sheet(back, false, [
      gap(6), ring("mail"), gap(20),
      title("Verify your email", "Open the verification link in your email to confirm your account."),
      gap(14), el("p", { class: "note faint", text: "Check your spam folder too." }),
      gap(28), cta, gap(10), alt, gap(20),
      el("div", { style: { textAlign: "center" } }, link("Back to sign in", toSignIn))
    ]);
  }

    var email = field({ label: "Email", hint: "you@yourbusiness.com", icon: "mail", type: "email" });

    ]);

  /* ---- 09 Select Language ---- */
  function languageModal() {
    var choice = state.language;
    var rows = [];
    var scrim = el("div", { class: "scrim", onclick: function (e) { if (e.target === scrim) close(null); } });
    function close(v) {
      if (v) state.language = v;
      if (scrim.parentNode) scrim.parentNode.removeChild(scrim);
      if (v) render();
    }
    var modal = el("div", { class: "modal" },
      el("div", { class: "grab" }),
      title("Select language", "Choose your preferred language."),
      gap(20));
    LANGS.forEach(function (L) {
      var name = L[0], code = L[1], badge = L[2];
      var script = code === "zh" ? " han" : code === "ta" ? " tamil" : "";
      var b = el("button", { class: "lang" });
      var badgeEl = el("span", { class: "badge" + script });
      if (badge === "globe") badgeEl.appendChild(icon("globe", 19, "var(--ink)"));
      else badgeEl.textContent = badge;
      b.appendChild(badgeEl);
      b.appendChild(el("span", { class: "name" + script, text: name }));
      var mark = el("span");
      b.appendChild(mark);
      b.addEventListener("click", function () { choice = name; paint(); });
      rows.push({ btn: b, mark: mark, name: name });
      modal.appendChild(b);
    });
    function paint() {
      rows.forEach(function (r) {
        var on = r.name === choice;
        r.btn.className = "lang" + (on ? " on" : "");
        r.mark.innerHTML = "";
        if (on) r.mark.appendChild(icon("circleCheck", 24, "var(--navy)"));
        else { r.mark.className = "radio"; return; }
        r.mark.className = "";
      });
    }
    paint();
    modal.appendChild(gap(10));
    modal.appendChild(primary("Continue", function () { close(choice); }));
    scrim.appendChild(modal);
    app.appendChild(scrim);
  }

  /* ---- screen index (prototype chrome, not a locked board) ---- */
  var INDEX = [
    ["splash", "01 Splash"], ["signIn", "02 Sign In"], ["emailSignIn", "03 Email Sign In"],
    ["signUp", "04 Create Account"], ["forgot", "05 Forgot Password"],
    ["checkEmail", "06 Check Your Email"], ["setNew", "07 Set a New Password"],
    ["updated", "08 Password Updated"], ["language", "09 Select Language"],
    ["verify", "10 Verify Your Email"], ["verified", "11 Email Verified"],
    ["expired", "12 Verification Link Expired"],
    ["sLoading", "State · Loading"], ["sInvalid", "State · Invalid credentials"],
    ["sMismatch", "State · Password mismatch"], ["sConnection", "State · Connection problem"],
    ["sRate", "State · Rate limited"], ["sResend", "State · Resend in progress"]
  ];
  function indexModal() {
    var scrim = el("div", { class: "scrim", onclick: function (e) { if (e.target === scrim) close(null); } });
    function close(v) {
      if (scrim.parentNode) scrim.parentNode.removeChild(scrim);
      if (v) replace(v);
    }
    var modal = el("div", { class: "modal" },
      el("div", { class: "grab" }),
      el("h1", { text: "Locked screens", style: { margin: "0", fontSize: "20px", fontWeight: "800" } }),
      el("p", {
        text: "Prototype navigation — not part of the locked UI.",
        style: { margin: "2px 0 14px", fontSize: "13.5px", fontWeight: "500", color: "var(--ink-muted)" }
      }));
    var cur = state.stack[state.stack.length - 1];
    INDEX.forEach(function (R) {
      var b = el("button", { class: "idxrow" + (R[0] === cur ? " on" : "") }, R[1]);
      if (R[0] === cur) b.appendChild(icon("check", 18, "var(--navy)"));
      b.addEventListener("click", function () { close(R[0]); });
      modal.appendChild(b);
    });
    scrim.appendChild(modal);
    app.appendChild(scrim);
  }

  /* ---- render ---- */
  function build(stage) {
    switch (stage) {
      case "splash": return splash();
      case "signIn": return signIn();
      case "emailSignIn": return emailSignIn("idle");
      case "sLoading": return emailSignIn("loading");
      case "sInvalid": return emailSignIn("invalid");
      case "sConnection": return emailSignIn("connection");
      case "sRate": return emailSignIn("rate");
      case "signUp": return signUp();
      case "forgot": return forgot();
      case "checkEmail": return checkEmail();
      case "setNew": return setNew(false);
      case "sMismatch": return setNew(true);
      case "updated": return updated();
      case "verify": return verify(false);
      case "sResend": return verify(true);
      case "verified": return verified();
      case "expired": return expired();
      case "language": return signIn();
      default: return signIn();
    }
  }

  function render() {
    clearTimers();
    var stage = state.stack[state.stack.length - 1];
    app.innerHTML = "";
    app.appendChild(build(stage));
    if (stage !== "splash") {
      var ix = el("button", { class: "indexbtn", onclick: indexModal });
      ix.appendChild(icon("grid", 17, "#fff"));
      ix.appendChild(document.createTextNode("Screens"));
      app.appendChild(ix);
    }
    // Opening "09 Select Language" from the index lands on the sheet itself.
    if (stage === "language") languageModal();
    // The loading state should show its spinner, not an idle button.
    if (stage === "sLoading") {
      var btn = app.querySelector(".btn.primary");
      if (btn && btn.setLabel) btn.setLabel("Signing in…", true);
    }
  }

  // Any failure must be visible, not a silent navy rectangle.
  try {
    render();
  } catch (e) {
    app.appendChild(el("div", { class: "fatal", text: "Prototype failed to start:\n\n" + (e && e.stack || e) }));
  }
  window.addEventListener("error", function (ev) {
    if (document.querySelector(".fatal")) return;
    app.appendChild(el("div", { class: "fatal", text: "Runtime error:\n\n" + (ev.message || "") + "\n" + (ev.filename || "") + ":" + (ev.lineno || "") }));
  });
})();
</script>
</body>
</html>
