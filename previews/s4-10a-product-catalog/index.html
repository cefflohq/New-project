<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <title>S4-10A Product Catalog Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--purple:#7C6CF0;--purple-tint:#F2F0FF;--text:#17151D;--muted:#73717C;--line:#E7E4EF;--page:#F5F4F7;--surface:#fff;--danger:#D94C4C}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,system-ui;color:var(--text)}body{background:#E9E8ED}.shell{width:100%;max-width:430px;min-height:100dvh;margin:auto;background:var(--page)}button,input,textarea,select{font:inherit}.preview-label{position:fixed;z-index:20;top:6px;left:50%;transform:translateX(-50%);padding:5px 10px;border-radius:99px;background:#211E29;color:#fff;font-size:9px;font-weight:700;letter-spacing:.05em}.app{padding-top:32px}.header{position:sticky;top:0;z-index:10;height:56px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.header h1{margin:0;font-size:17px;font-weight:600}.header button{border:0;background:transparent}.add{height:38px;padding:0 15px;border-radius:99px!important;background:var(--purple)!important;color:#fff;font-size:12px;font-weight:600}.content{padding:14px 10px 40px}.search{height:44px;margin-bottom:12px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:#fff}.search input{width:100%;height:100%;border:0;outline:0;background:transparent;font-size:13px}.filters{display:flex;gap:7px;margin-bottom:19px}.filter{height:34px;padding:0 15px;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--muted);font-size:12px;font-weight:600}.filter.selected{border-color:#DDD7FF;background:var(--purple-tint);color:#6552D8}.category{margin-bottom:23px}.category-head{height:38px;padding:0 4px;display:flex;align-items:center;justify-content:space-between}.category-head h2{margin:0;font-size:14px;font-weight:600}.category-head span{color:var(--muted);font-size:10px}.rows{overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#fff}.product-row{min-height:66px;padding:9px 8px;display:grid;grid-template-columns:34px minmax(0,1fr) auto 34px;gap:8px;align-items:center;border-bottom:1px solid #EFEDF2;transition:background .15s,opacity .15s}.product-row:last-child{border-bottom:0}.product-row.dragging{opacity:.5;background:var(--purple-tint)}.product-row.drag-over{box-shadow:inset 0 2px var(--purple)}.handle{width:34px;height:42px;border:0;background:transparent;color:#A3A0AA;font-size:20px;cursor:grab;touch-action:none}.handle:focus-visible{outline:3px solid #DCD5FF;border-radius:9px}.product-copy{min-width:0}.product-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600}.product-description{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:10.5px}.price{padding-left:6px;white-space:nowrap;font-size:12.5px;font-weight:600}.more{width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:#77747E;font-size:18px}.status{display:inline-flex;margin-top:3px;padding:2px 7px;border-radius:99px;font-size:9px;font-weight:600}.status.active{background:#EDF8F1;color:#278B4A}.status.hidden{background:#F0EFF2;color:#77747E}.empty{padding:25px;text-align:center;color:var(--muted);font-size:12px}.hint{margin:7px 3px 0;color:#8B8992;font-size:9px}.sheet-shade{position:fixed;z-index:30;inset:0;background:rgba(24,21,31,.35);display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(100%,430px);max-height:92dvh;padding:8px 17px calc(20px + env(safe-area-inset-bottom));overflow:auto;border-radius:26px 26px 0 0;background:#fff}.grabber{width:42px;height:5px;margin:3px auto 16px;border-radius:99px;background:#E5E2EA}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet h2{margin:0;font-size:17px}.close{width:38px;height:38px;border:0;border-radius:50%;background:#F5F4F7;font-size:20px}.field{margin-top:15px}.field label{display:block;margin-bottom:6px;color:#65636C;font-size:11.5px;font-weight:600}.field input,.field textarea,.field select{width:100%;min-height:46px;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--text);font-size:13px;outline:0}.field textarea{height:76px;resize:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-tint)}.visibility{display:flex;gap:8px}.visibility button{flex:1;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);font-size:12px;font-weight:600}.visibility .selected{border-color:#DCD5FF;background:var(--purple-tint);color:#6552D8}.save{width:100%;height:50px;margin-top:20px;border:0;border-radius:99px;background:var(--purple);color:#fff;font-size:14px;font-weight:600}.menu{position:fixed;z-index:40;width:176px;padding:6px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 15px 35px rgba(25,21,35,.16)}.menu button{width:100%;height:42px;padding:0 12px;border:0;border-radius:9px;background:#fff;text-align:left;font-size:12px}.menu button:hover,.menu button:focus{background:#F6F5F8}.menu .archive{color:var(--danger)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.announcement{position:fixed;z-index:50;left:50%;bottom:20px;transform:translateX(-50%);padding:9px 13px;border-radius:99px;background:#211E29;color:#fff;font-size:10px;white-space:nowrap}@media(max-width:370px){.product-row{grid-template-columns:32px minmax(0,1fr) auto 32px;gap:5px}.content{padding-left:7px;padding-right:7px}.price{font-size:11.5px}.product-name{font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="preview-label">S4-10A UI Preview · Local Demo</div>
  <main class="shell"><div class="app"><header class="header"><h1>Products</h1><button class="add" id="addButton">+ Add Product</button></header><div class="content"><div class="search"><input id="search" aria-label="Search products" placeholder="Search products"></div><div class="filters" role="tablist" aria-label="Product visibility"><button class="filter selected" data-filter="active">Active</button><button class="filter" data-filter="hidden">Hidden</button></div><div id="catalog"></div><p class="hint">Drag ⠿ within a category. Keyboard: focus handle, then Alt + ↑ / ↓.</p></div></div></main>
  <div id="overlay"></div><div class="sr-only" aria-live="polite" id="live"></div>
  <script>
    const categories=[{id:'food',name:'Makanan',sort:0},{id:'drink',name:'Minuman',sort:1},{id:'addon',name:'Add-on',sort:2}];
    const requestedWidth=Number(new URLSearchParams(location.search).get('width'));
    if([430,390,360].includes(requestedWidth))document.querySelector('.shell').style.maxWidth=`${requestedWidth}px`;
    let products=[
      {id:'p1',category:'food',name:'Nasi Lemak Ayam',description:'Sambal house dan ayam rangup',price:12,status:'active',sort:0},
      {id:'p2',category:'food',name:'Mee Kari Special Panjang Untuk Semak Susun Atur',description:'Kuah kari, tauhu dan telur',price:10,status:'active',sort:1},
      {id:'p3',category:'drink',name:'Teh Ais Limau',description:'Teh segar dengan limau',price:6.5,status:'active',sort:0},
      {id:'p4',category:'drink',name:'Kopi Ais',description:'Kopi susu house blend',price:5,status:'active',sort:1},
      {id:'p5',category:'addon',name:'Telur Mata',description:'Produk kategori Add-on',price:2,status:'active',sort:0},
      {id:'p6',category:'food',name:'Karipap Pusing',description:'Disembunyikan daripada katalog aktif',price:8,status:'hidden',sort:2}
    ];
    let filter='active',query='',editing=null,dragged=null,touchTarget=null,menuFor=null;
    const catalog=document.querySelector('#catalog'),overlay=document.querySelector('#overlay'),live=document.querySelector('#live');
    const money=n=>`RM${Number(n).toFixed(2)}`;
    function normalized(){return categories.slice().sort((a,b)=>a.sort-b.sort).map(c=>({...c,products:products.filter(p=>p.category===c.id&&p.status===filter&&p.name.toLowerCase().includes(query)).sort((a,b)=>a.sort-b.sort)}))}
    function render(){catalog.innerHTML=normalized().map(c=>`<section class="category" data-category="${c.id}"><div class="category-head"><h2>${c.name}</h2><span>${c.products.length} product${c.products.length===1?'':'s'}</span></div><div class="rows">${c.products.length?c.products.map(row).join(''):'<div class="empty">No products in this category</div>'}</div></section>`).join('');bindRows()}
    function row(p){return `<article class="product-row" data-id="${p.id}" data-category="${p.category}"><button class="handle" draggable="true" aria-label="Reorder ${p.name}. Hold Alt and press arrow keys." title="Drag to reorder">⠿</button><div class="product-copy"><div class="product-name">${p.name}</div><div class="product-description">${p.description||'No description'}</div><span class="status ${p.status}">${p.status==='active'?'Active':'Hidden'}</span></div><div class="price">${money(p.price)}</div><button class="more" aria-label="Actions for ${p.name}" data-menu="${p.id}">•••</button></article>`}
    function bindRows(){document.querySelectorAll('.product-row').forEach(r=>{r.ondragover=e=>{if(dragged&&products.find(p=>p.id===dragged)?.category===r.dataset.category){e.preventDefault();r.classList.add('drag-over')}};r.ondragleave=()=>r.classList.remove('drag-over');r.ondrop=e=>{e.preventDefault();const from=dragged,to=r.dataset.id;clearDrag();moveBefore(from,to)}});document.querySelectorAll('.handle').forEach(h=>{h.ondragstart=e=>{dragged=h.closest('.product-row').dataset.id;h.closest('.product-row').classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragged)};h.ondragend=clearDrag;h.onkeydown=e=>{if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();keyboardMove(h.closest('.product-row').dataset.id,e.key==='ArrowUp'?-1:1)}};h.onpointerdown=e=>{if(e.pointerType==='mouse')return;dragged=h.closest('.product-row').dataset.id;touchTarget=null;h.closest('.product-row').classList.add('dragging');h.setPointerCapture?.(e.pointerId)};h.onpointermove=e=>{if(!dragged||e.pointerType==='mouse')return;trackTouch(e.clientX,e.clientY)};h.onpointerup=e=>{if(e.pointerType==='mouse')return;const from=dragged,to=touchTarget;clearDrag();if(from&&to)moveBefore(from,to)}});document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=e=>openMenu(e.currentTarget.dataset.menu,e.currentTarget.getBoundingClientRect()))}
    function trackTouch(x,y){const target=document.elementFromPoint(x,y)?.closest('.product-row');document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));if(target&&target.dataset.category===products.find(p=>p.id===dragged)?.category&&target.dataset.id!==dragged){touchTarget=target.dataset.id;target.classList.add('drag-over')}}
    function clearDrag(){dragged=null;touchTarget=null;document.querySelectorAll('.dragging,.drag-over').forEach(x=>x.classList.remove('dragging','drag-over'))}
    function reindex(category){products.filter(p=>p.category===category).sort((a,b)=>a.sort-b.sort).forEach((p,i)=>p.sort=i)}
    function moveBefore(from,to){if(!from||from===to)return;const a=products.find(p=>p.id===from),b=products.find(p=>p.id===to);if(!a||!b||a.category!==b.category)return;const list=products.filter(p=>p.category===a.category).sort((x,y)=>x.sort-y.sort).filter(p=>p.id!==a.id),idx=list.findIndex(p=>p.id===b.id);list.splice(idx,0,a);list.forEach((p,i)=>p.sort=i);announce(`${a.name} reordered within ${categories.find(c=>c.id===a.category).name}`);render()}
    function keyboardMove(id,delta){const p=products.find(x=>x.id===id),list=products.filter(x=>x.category===p.category&&x.status===filter).sort((a,b)=>a.sort-b.sort),from=list.findIndex(x=>x.id===id),to=Math.max(0,Math.min(list.length-1,from+delta));if(from===to)return;const target=list[to];const temp=p.sort;p.sort=target.sort;target.sort=temp;announce(`${p.name} moved to position ${to+1}`);render();setTimeout(()=>document.querySelector(`[data-id="${id}"] .handle`)?.focus(),0)}
    function announce(text){live.textContent=text;document.querySelector('.announcement')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="announcement">${text}</div>`);setTimeout(()=>document.querySelector('.announcement')?.remove(),1300)}
    function openMenu(id,rect){menuFor=id;const p=products.find(x=>x.id===id),top=Math.min(innerHeight-145,rect.bottom+4),left=Math.min(innerWidth-186,rect.right-176);overlay.innerHTML=`<div class="menu" style="top:${top}px;left:${left}px"><button id="edit">Edit Product</button><button id="toggle">${p.status==='active'?'Move to Hidden':'Move to Active'}</button><button class="archive" id="archive">Archive</button></div>`;document.querySelector('#edit').onclick=()=>openForm(p);document.querySelector('#toggle').onclick=()=>{p.status=p.status==='active'?'hidden':'active';overlay.innerHTML='';announce(`${p.name} is now ${p.status}`);render()};document.querySelector('#archive').onclick=()=>{products=products.filter(x=>x.id!==id);reindex(p.category);overlay.innerHTML='';announce(`${p.name} archived`);render()}}
    function openForm(p=null){editing=p?.id||null;overlay.innerHTML=`<div class="sheet-shade"><section class="sheet" role="dialog" aria-modal="true" aria-label="${p?'Edit':'Add'} Product"><div class="grabber"></div><div class="sheet-head"><h2>${p?'Edit Product':'Add Product'}</h2><button class="close" aria-label="Close">×</button></div><div class="field"><label>Product name</label><input id="name" maxlength="120" value="${p?.name||''}" placeholder="e.g. Nasi Lemak Ayam"></div><div class="field"><label>Category</label><select id="category">${categories.map(c=>`<option value="${c.id}" ${p?.category===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="field"><label>Description <span style="font-weight:400">(optional)</span></label><textarea id="description" maxlength="1000" placeholder="Short product description">${p?.description||''}</textarea></div><div class="field"><label>Display price</label><input id="price" type="number" min="0" step="0.01" value="${p?.price??''}" placeholder="0.00"></div><div class="field"><label>Visibility</label><div class="visibility"><button data-status="active" class="${!p||p.status==='active'?'selected':''}">Active</button><button data-status="hidden" class="${p?.status==='hidden'?'selected':''}">Hidden</button></div></div><button class="save">Save Product</button></section></div>`;let status=p?.status||'active';document.querySelector('.close').onclick=()=>overlay.innerHTML='';document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{status=b.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('selected',x.dataset.status===status))});document.querySelector('.save').onclick=()=>{const name=document.querySelector('#name').value.trim(),category=document.querySelector('#category').value,description=document.querySelector('#description').value.trim(),price=Number(document.querySelector('#price').value);if(!name||!Number.isFinite(price)||price<0)return announce('Enter a valid name and display price');if(p){const old=p.category;p.name=name;p.category=category;p.description=description;p.price=price;p.status=status;if(old!==category){reindex(old);p.sort=products.filter(x=>x.category===category&&x.id!==p.id).length}}else products.push({id:`p${Date.now()}`,name,category,description,price,status,sort:products.filter(x=>x.category===category).length});overlay.innerHTML='';filter=status;syncFilters();announce(`Product ${p?'updated':'added'}`);render()}}
    function syncFilters(){document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('selected',b.dataset.filter===filter))}
    document.querySelector('#addButton').onclick=()=>openForm();document.querySelector('#search').oninput=e=>{query=e.target.value.toLowerCase();render()};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;syncFilters();render()});document.addEventListener('click',e=>{if(menuFor&&!e.target.closest('.menu')&&!e.target.closest('[data-menu]')){overlay.innerHTML='';menuFor=null}});render();
  </script>
</body></html>
