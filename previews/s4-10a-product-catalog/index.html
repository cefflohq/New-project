<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <title>S4-10A Product Catalog Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--purple:#7C6CF0;--purple-dark:#6552D8;--purple-tint:#F2F0FF;--text:#17151D;--muted:#76737D;--soft:#A29FA8;--line:#ECEAF0;--surface:#FFF;--danger:#C84949}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,system-ui;color:var(--text)}body{background:#EEEDEF}.shell{width:100%;max-width:430px;min-height:100dvh;margin:auto;background:var(--surface)}button,input,textarea,select{font:inherit}.preview-label{position:fixed;z-index:20;top:6px;left:50%;transform:translateX(-50%);padding:5px 10px;border-radius:99px;background:#211E29;color:#fff;font-size:9px;font-weight:700;letter-spacing:.05em}.app{padding-top:32px}.header{position:sticky;top:0;z-index:10;min-height:72px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.heading{min-width:0}.header h1{margin:0;font-size:19px;line-height:1.2;font-weight:600;letter-spacing:-.02em}.header p{margin:3px 0 0;color:var(--muted);font-size:10.5px}.header button{border:0}.add{flex:0 0 auto;min-width:74px;height:44px;padding:0 12px;border-radius:11px;background:var(--purple);color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px}.add svg{width:16px;height:16px}.content{padding:16px 16px 40px}.search{height:44px;margin-bottom:16px;padding:0 12px;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;background:#FAF9FB}.search svg{width:17px;height:17px;color:#96939D}.search input{min-width:0;width:100%;height:100%;border:0;outline:0;background:transparent;font-size:12.5px}.search:focus-within{border-color:#CFC8FF;background:#fff;box-shadow:0 0 0 3px var(--purple-tint)}.filters{height:42px;margin-bottom:24px;display:flex;gap:24px;border-bottom:1px solid var(--line)}.filter{position:relative;height:42px;padding:0;border:0;background:transparent;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}.filter span{margin-left:5px;color:var(--soft);font-feature-settings:"tnum"}.filter.selected{color:var(--purple-dark)}.filter.selected span{color:var(--purple-dark)}.filter.selected:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--purple)}.category{margin-bottom:28px}.category-head{height:32px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line)}.category-head h2{margin:0;font-size:13.5px;font-weight:600;letter-spacing:-.01em}.category-head span{padding-top:2px;color:var(--soft);font-size:10px;font-feature-settings:"tnum"}.rows{background:#fff}.product-row{position:relative;min-height:72px;padding:11px 0;display:grid;grid-template-columns:36px minmax(0,1fr) minmax(57px,auto) 44px;gap:8px;align-items:center;border-bottom:1px solid var(--line);transition:background .14s,opacity .14s,box-shadow .14s,transform .18s cubic-bezier(.2,.75,.25,1)}.product-row:last-child{border-bottom:0}.product-row.dragging{z-index:2;opacity:.94;background:#FAF9FF;box-shadow:0 6px 16px rgba(36,30,53,.1);transform:translateY(var(--drag-y,0));transition:background .14s,opacity .14s,box-shadow .14s}.product-row.drag-before:not(.dragging){transform:translateY(5px)}.product-row.drag-after:not(.dragging){transform:translateY(-5px)}.product-row.drag-before:before,.product-row.drag-after:after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--purple)}.product-row.drag-before:before{top:-1px}.product-row.drag-after:after{bottom:-1px}.handle{width:36px;height:44px;padding:0;border:0;background:transparent;color:#AAA7B0;display:grid;place-items:center;cursor:grab;touch-action:none}.handle svg{width:18px;height:18px}.handle:focus-visible,.more:focus-visible{outline:3px solid #DED9FF;border-radius:9px}.product-copy{min-width:0}.product-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;line-height:1.4;font-weight:600;letter-spacing:-.005em}.product-description{margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:10px;line-height:1.35}.price{padding-left:4px;white-space:nowrap;text-align:right;font-size:12px;font-weight:600;font-feature-settings:"tnum"}.more{width:44px;height:44px;padding:0;border:0;background:transparent;color:#85818B;display:grid;place-items:center}.more svg{width:20px;height:20px}.empty{padding:20px 0;color:var(--muted);font-size:11px}.hint{margin:4px 0 0;color:#98959E;font-size:9px}.sheet-shade{position:fixed;z-index:30;inset:0;background:rgba(24,21,31,.34);display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(100%,430px);max-height:92dvh;padding:8px 20px calc(20px + env(safe-area-inset-bottom));overflow:auto;border-radius:24px 24px 0 0;background:#fff}.grabber{width:40px;height:4px;margin:3px auto 20px;border-radius:99px;background:#E5E2EA}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet h2{margin:0;font-size:17px;font-weight:600}.close{width:44px;height:44px;padding:0;border:0;border-radius:50%;background:transparent;color:#77737D;display:grid;place-items:center}.close svg{width:20px;height:20px}.field{margin-top:16px}.field label{display:block;margin-bottom:6px;color:#65636C;font-size:11px;font-weight:600}.field input,.field textarea,.field select{width:100%;min-height:46px;padding:12px 13px;border:1px solid #DFDDE4;border-radius:10px;background:#fff;color:var(--text);font-size:12.5px;outline:0}.field textarea{height:76px;resize:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-tint)}.visibility{height:42px;display:flex;border-bottom:1px solid var(--line);gap:20px}.visibility button{position:relative;height:42px;padding:0 2px;border:0;background:#fff;color:var(--muted);font-size:11px;font-weight:600}.visibility .selected{color:var(--purple-dark)}.visibility .selected:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--purple)}.save{width:100%;height:50px;margin-top:24px;border:0;border-radius:12px;background:var(--purple);color:#fff;font-size:13px;font-weight:600}.archive-form{width:100%;height:44px;margin-top:8px;border:0;background:transparent;color:var(--danger);font-size:11.5px;font-weight:500}.menu{position:fixed;z-index:40;width:176px;padding:6px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 12px 30px rgba(25,21,35,.13)}.menu button{width:100%;height:44px;padding:0 12px;border:0;border-radius:8px;background:#fff;text-align:left;font-size:11.5px}.menu button:hover,.menu button:focus{background:#F7F6F8}.menu .archive{color:var(--danger)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.announcement{position:fixed;z-index:50;left:50%;bottom:20px;transform:translateX(-50%);padding:9px 13px;border-radius:99px;background:#211E29;color:#fff;font-size:10px;white-space:nowrap}@media(max-width:370px){.header{padding-left:12px;padding-right:12px}.header h1{font-size:17px}.header p{font-size:9.5px}.add{min-width:68px;padding:0 10px}.content{padding-left:12px;padding-right:12px}.product-row{grid-template-columns:32px minmax(0,1fr) 55px 44px;gap:5px}.handle{width:32px}.product-name{font-size:11.75px}.product-description{font-size:9.5px}.price{font-size:11px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="preview-label">S4-10A UI Preview · Local Demo</div>
  <main class="shell"><div class="app"><header class="header"><div class="heading"><h1>Products</h1><p>Manage your products</p></div><button class="add" id="addButton" aria-label="+ Add Product"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Add</button></header><div class="content"><div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="search" aria-label="Search products" placeholder="Search products"></div><div class="filters" role="tablist" aria-label="Product visibility"><button class="filter selected" data-filter="active">Active <span id="activeCount">0</span></button><button class="filter" data-filter="hidden">Hidden <span id="hiddenCount">0</span></button></div><div id="catalog"></div><p class="hint">Drag the grip within a category. Keyboard: focus handle, then Alt + ↑ / ↓.</p></div></div></main>
  <div id="overlay"></div><div class="sr-only" aria-live="polite" id="live"></div>
  <script>
    const categories=[{id:'food',name:'Food',sort:0},{id:'drink',name:'Drinks',sort:1},{id:'addon',name:'Add-ons',sort:2}];
    const requestedWidth=Number(new URLSearchParams(location.search).get('width'));
    if([430,390,360].includes(requestedWidth))document.querySelector('.shell').style.maxWidth=`${requestedWidth}px`;
    let products=[
      {id:'p1',category:'food',name:'Chicken Nasi Lemak',description:'House sambal · crispy chicken',price:12,status:'active',sort:0},
      {id:'p2',category:'food',name:'Curry Noodles Special with a Long Product Name',description:'Curry broth · tofu · egg',price:10,status:'active',sort:1},
      {id:'p3',category:'drink',name:'Iced Lime Tea',description:'Fresh tea · lime',price:6.5,status:'active',sort:0},
      {id:'p4',category:'drink',name:'Iced Coffee',description:'House-blend milk coffee',price:5,status:'active',sort:1},
      {id:'p5',category:'addon',name:'Sunny-Side Egg',description:'Optional add-on item',price:2,status:'active',sort:0},
      {id:'p6',category:'food',name:'Spiral Curry Puff',description:'Hidden from the active catalog',price:8,status:'hidden',sort:2}
    ];
    let filter='active',query='',editing=null,dragged=null,dropTarget=null,pointerDrag=null,menuFor=null;
    const catalog=document.querySelector('#catalog'),overlay=document.querySelector('#overlay'),live=document.querySelector('#live');
    const money=n=>`RM${Number(n).toFixed(2)}`;
    function normalized(){return categories.slice().sort((a,b)=>a.sort-b.sort).map(c=>({...c,products:products.filter(p=>p.category===c.id&&p.status===filter&&p.name.toLowerCase().includes(query)).sort((a,b)=>a.sort-b.sort)}))}
    function render(){catalog.innerHTML=normalized().map(c=>`<section class="category" data-category="${c.id}"><div class="category-head"><h2>${c.name}</h2><span>${c.products.length}</span></div><div class="rows">${c.products.length?c.products.map(row).join(''):'<div class="empty">No products in this category</div>'}</div></section>`).join('');bindRows();syncFilters()}
    function row(p){return `<article class="product-row" data-id="${p.id}" data-category="${p.category}"><button class="handle" draggable="true" aria-label="Reorder ${p.name}. Hold Alt and press arrow keys." title="Drag to reorder"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="7" cy="5" r="1.15" fill="currentColor"/><circle cx="13" cy="5" r="1.15" fill="currentColor"/><circle cx="7" cy="10" r="1.15" fill="currentColor"/><circle cx="13" cy="10" r="1.15" fill="currentColor"/><circle cx="7" cy="15" r="1.15" fill="currentColor"/><circle cx="13" cy="15" r="1.15" fill="currentColor"/></svg></button><div class="product-copy"><div class="product-name">${p.name}</div><div class="product-description">${p.description||'No description'}</div></div><div class="price">${money(p.price)}</div><button class="more" aria-label="Actions for ${p.name}" data-menu="${p.id}"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></svg></button></article>`}
    function bindRows(){document.querySelectorAll('.handle').forEach(h=>{h.addEventListener('dragstart',e=>e.preventDefault());h.addEventListener('keydown',e=>{if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();keyboardMove(h.closest('.product-row').dataset.id,e.key==='ArrowUp'?-1:1)}});h.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;const row=h.closest('.product-row');dragged=row.dataset.id;dropTarget=null;pointerDrag={pointerId:e.pointerId,handle:h,row,startY:e.clientY};row.classList.add('dragging');try{h.setPointerCapture?.(e.pointerId)}catch{}e.preventDefault()});h.addEventListener('pointermove',e=>{if(!pointerDrag||e.pointerId!==pointerDrag.pointerId)return;e.preventDefault();pointerDrag.row.style.setProperty('--drag-y',`${e.clientY-pointerDrag.startY}px`);trackPointer(e.clientX,e.clientY)});h.addEventListener('pointerup',finishPointerDrag);h.addEventListener('pointercancel',cancelPointerDrag);h.addEventListener('lostpointercapture',e=>{if(pointerDrag&&e.pointerId===pointerDrag.pointerId)clearDrag()})});document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=e=>openMenu(e.currentTarget.dataset.menu,e.currentTarget.getBoundingClientRect()))}
    function trackPointer(x,y){document.querySelectorAll('.drag-before,.drag-after').forEach(el=>el.classList.remove('drag-before','drag-after'));dropTarget=null;const source=products.find(p=>p.id===dragged),hit=document.elementFromPoint(x,y),category=hit?.closest('.category');if(!source||!category||category.dataset.category!==source.category)return;const candidates=[...category.querySelectorAll('.product-row')].filter(row=>row.dataset.id!==dragged);if(!candidates.length)return;let target=hit?.closest('.product-row');if(!target||target.dataset.id===dragged){target=candidates.reduce((best,row)=>Math.abs(y-(row.getBoundingClientRect().top+row.getBoundingClientRect().height/2))<Math.abs(y-(best.getBoundingClientRect().top+best.getBoundingClientRect().height/2))?row:best)}const rect=target.getBoundingClientRect(),position=y<rect.top+rect.height/2?'before':'after';dropTarget={id:target.dataset.id,position};target.classList.add(position==='before'?'drag-before':'drag-after')}
    function finishPointerDrag(e){if(!pointerDrag||e.pointerId!==pointerDrag.pointerId)return;const from=dragged,target=dropTarget;const handle=pointerDrag.handle;if(handle.hasPointerCapture?.(e.pointerId))handle.releasePointerCapture(e.pointerId);clearDrag();if(from&&target)moveRelative(from,target.id,target.position)}
    function cancelPointerDrag(e){if(!pointerDrag||e.pointerId!==pointerDrag.pointerId)return;const handle=pointerDrag.handle;if(handle.hasPointerCapture?.(e.pointerId))handle.releasePointerCapture(e.pointerId);clearDrag()}
    function clearDrag(){if(pointerDrag?.row)pointerDrag.row.style.removeProperty('--drag-y');dragged=null;dropTarget=null;pointerDrag=null;document.querySelectorAll('.dragging,.drag-before,.drag-after').forEach(x=>x.classList.remove('dragging','drag-before','drag-after'))}
    function reindex(category){products.filter(p=>p.category===category).sort((a,b)=>a.sort-b.sort).forEach((p,i)=>p.sort=i)}
    function rowPositions(){return new Map([...document.querySelectorAll('.product-row')].map(row=>[row.dataset.id,row.getBoundingClientRect().top]))}
    function animateReorder(before){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;document.querySelectorAll('.product-row').forEach(row=>{const previous=before.get(row.dataset.id),current=row.getBoundingClientRect().top,delta=previous-current;if(previous!==undefined&&Math.abs(delta)>1&&row.animate)row.animate([{transform:`translateY(${delta}px)`},{transform:'translateY(0)'}],{duration:240,easing:'cubic-bezier(.2,.75,.25,1)'})})}
    function moveRelative(from,to,position){if(!from||from===to)return;const a=products.find(p=>p.id===from),b=products.find(p=>p.id===to);if(!a||!b||a.category!==b.category)return;const before=rowPositions(),list=products.filter(p=>p.category===a.category).sort((x,y)=>x.sort-y.sort).filter(p=>p.id!==a.id);let idx=list.findIndex(p=>p.id===b.id);if(idx<0)return;if(position==='after')idx+=1;list.splice(idx,0,a);list.forEach((p,i)=>p.sort=i);announce(`${a.name} reordered within ${categories.find(c=>c.id===a.category).name}`);render();animateReorder(before)}
    function keyboardMove(id,delta){const p=products.find(x=>x.id===id),list=products.filter(x=>x.category===p.category&&x.status===filter).sort((a,b)=>a.sort-b.sort),from=list.findIndex(x=>x.id===id),to=Math.max(0,Math.min(list.length-1,from+delta));if(from===to)return;const target=list[to];const temp=p.sort;p.sort=target.sort;target.sort=temp;announce(`${p.name} moved to position ${to+1}`);render();setTimeout(()=>document.querySelector(`[data-id="${id}"] .handle`)?.focus(),0)}
    function announce(text){live.textContent=text;document.querySelector('.announcement')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="announcement">${text}</div>`);setTimeout(()=>document.querySelector('.announcement')?.remove(),1300)}
    function openMenu(id,rect){menuFor=id;const p=products.find(x=>x.id===id),top=Math.min(innerHeight-145,rect.bottom+4),left=Math.min(innerWidth-186,rect.right-176);overlay.innerHTML=`<div class="menu" style="top:${top}px;left:${left}px"><button id="edit">Edit Product</button><button id="toggle">${p.status==='active'?'Move to Hidden':'Move to Active'}</button><button class="archive" id="archive">Archive</button></div>`;document.querySelector('#edit').onclick=()=>openForm(p);document.querySelector('#toggle').onclick=()=>{p.status=p.status==='active'?'hidden':'active';overlay.innerHTML='';announce(`${p.name} is now ${p.status}`);render()};document.querySelector('#archive').onclick=()=>{products=products.filter(x=>x.id!==id);reindex(p.category);overlay.innerHTML='';announce(`${p.name} archived`);render()}}
    function openForm(p=null){editing=p?.id||null;overlay.innerHTML=`<div class="sheet-shade"><section class="sheet" role="dialog" aria-modal="true" aria-label="${p?'Edit':'Add'} Product"><div class="grabber"></div><div class="sheet-head"><h2>${p?'Edit Product':'Add Product'}</h2><button class="close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div><div class="field"><label>Product name</label><input id="name" maxlength="120" value="${p?.name||''}" placeholder="e.g. Chicken Rice"></div><div class="field"><label>Category</label><select id="category">${categories.map(c=>`<option value="${c.id}" ${p?.category===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="field"><label>Description <span style="font-weight:400">(optional)</span></label><textarea id="description" maxlength="1000" placeholder="Short product description">${p?.description||''}</textarea></div><div class="field"><label>Display price</label><input id="price" type="number" min="0" step="0.01" value="${p?.price??''}" placeholder="0.00"></div><div class="field"><label>Visibility</label><div class="visibility"><button data-status="active" class="${!p||p.status==='active'?'selected':''}">Active</button><button data-status="hidden" class="${p?.status==='hidden'?'selected':''}">Hidden</button></div></div><button class="save">Save Product</button>${p?'<button class="archive-form" id="archiveForm">Archive Product</button>':''}</section></div>`;let status=p?.status||'active';document.querySelector('.close').onclick=()=>overlay.innerHTML='';document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{status=b.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('selected',x.dataset.status===status))});if(p)document.querySelector('#archiveForm').onclick=()=>{products=products.filter(x=>x.id!==p.id);reindex(p.category);overlay.innerHTML='';announce(`${p.name} archived`);render()};document.querySelector('.save').onclick=()=>{const name=document.querySelector('#name').value.trim(),category=document.querySelector('#category').value,description=document.querySelector('#description').value.trim(),price=Number(document.querySelector('#price').value);if(!name||!Number.isFinite(price)||price<0)return announce('Enter a valid name and display price');if(p){const old=p.category;p.name=name;p.category=category;p.description=description;p.price=price;p.status=status;if(old!==category){reindex(old);p.sort=products.filter(x=>x.category===category&&x.id!==p.id).length}}else products.push({id:`p${Date.now()}`,name,category,description,price,status,sort:products.filter(x=>x.category===category).length});overlay.innerHTML='';filter=status;announce(`Product ${p?'updated':'added'}`);render()}}
    function syncFilters(){document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('selected',b.dataset.filter===filter));document.querySelector('#activeCount').textContent=products.filter(p=>p.status==='active').length;document.querySelector('#hiddenCount').textContent=products.filter(p=>p.status==='hidden').length}
    document.querySelector('#addButton').onclick=()=>openForm();document.querySelector('#search').oninput=e=>{query=e.target.value.toLowerCase();render()};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;syncFilters();render()});document.addEventListener('click',e=>{if(menuFor&&!e.target.closest('.menu')&&!e.target.closest('[data-menu]')){overlay.innerHTML='';menuFor=null}});render();
  </script>
</body></html>
