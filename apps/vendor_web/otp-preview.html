<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Verify code preview · Cefflo Vendor</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script>window.CEFFLO_SESSION_KEY = 'cefflo.vendorweb.otppreview';</script>
<script src="/shared/config.js"></script>
<script src="/shared/client.js"></script>
</head>
<body>
<div id="app"></div>
<!-- Founder visual gate for the 6-digit code screen (not wired to Auth).
     Sample handlers only: 123456 verifies, 000000 is expired, anything else
     is incorrect. Never available in Production. ?purpose=recovery shows the
     password-recovery variant. -->
<script type="module">
import { renderVerifyCode } from './js/pages/auth.js';
import { demoAllowed } from './js/demo.js';
const root = document.getElementById('app');
const q = new URLSearchParams(location.search);
const wait = ms => new Promise(r => setTimeout(r, ms));
const start = () => renderVerifyCode(root, {}, {
  email: 'owner@kopikita.my',
  purpose: q.get('purpose') === 'recovery' ? 'recovery' : 'signup',
  cooldown: 30,
  onVerify: async code => {
    await wait(600);
    if (code === '000000') throw { kind: 'expired' };
    if (code !== '123456') throw { kind: 'incorrect' };
  },
  onResend: () => wait(600),
  onContinue: () => { root.innerHTML = '<div class="auth"><div class="auth-hero bare"></div><div class="auth-bottom"><div class="auth-card auth-center"><h1>Preview complete</h1><p>The real flow continues into Business Setup.</p><button class="btn primary" type="button" style="width:100%" onclick="location.reload()">Start again</button></div></div></div>'; },
  onBack: () => location.reload(),
});
if (demoAllowed()) start();
else root.innerHTML = '<p style="font:14px system-ui;padding:24px">Not available.</p>';
</script>
</body>
</html>
