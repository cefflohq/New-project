<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cefflo Vendor — manage your deliveries.">

  <!--
    Matches the app's top chrome: the Splash Anchor Blue surface's top-left
    tone (CefGradients.brandChrome, #01265E -- see lib/core/theme.dart, D-51),
    so the status bar and header read as one surface from launch. The app
    updates it at runtime per route. Without this, the browser/OS status bar and
    "add to home screen" surfaces fall back to Flutter's unedited scaffold
    default (#0175C2, a bright blue never used anywhere in this app's
    palette), which is exactly the mismatched band visible at the top of
    every screenshot: real app content is white/navy/yellow, but the strip
    just above it was still the untouched `flutter create` placeholder.
    manifest.json below must be kept in sync with this value.
  -->
  <meta name="theme-color" content="#01265E">
  <meta name="msapplication-navbutton-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cefflo Vendor">

  <!--
    Responsive normalization root cause: without this tag, mobile browsers
    fall back to their own undocumented default layout-viewport width
    (historically ~980px on Chrome/Android, but inconsistent per engine and
    OEM browser). Flutter Web reads that layout-viewport width as its
    logical-pixel canvas, so the identical fixed-logical-pixel UI ends up
    perceptually smaller/larger depending on which fallback a given
    browser happens to apply -- correct on one phone, off on another, with
    no Dart-side scaling bug involved. Pinning width=device-width,
    initial-scale=1 makes every browser report the real device CSS width,
    so Flutter's fixed component sizes render at consistent density
    everywhere. Deliberately omits user-scalable=no / maximum-scale so
    legitimate pinch-zoom and OS accessibility text scaling still work.
  -->
  <!--
    viewport-fit=cover makes the page edge-to-edge on Android: it draws behind
    the transparent gesture / navigation bar instead of above a black system
    strip, so whatever the screen shows continues to the physical bottom. The
    app adds the bottom inset itself (see #cef-safe-area below).
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cefflo Vendor</title>
  <link rel="manifest" href="manifest.json" id="cef-manifest">
  <script>
    // Operator / Helper entry (?access= or operator./helper. host): installing from it
    // gives an app that always reopens in that entry. Presentation only; the
    // role still comes from the server after sign-in.
    (function () {
      // ?access=, else the dedicated entry host (operator./helper.cefflo.com).
      var a = new URLSearchParams(location.search).get('access') || location.hostname.split('.')[0];
      if (a === 'operator' || a === 'helper') {
        document.getElementById('cef-manifest').href = 'manifest-' + a + '.json';
        document.title = a === 'operator' ? 'Cefflo Operator' : 'Cefflo Helper';
      }
    })();
  </script>
<style>
    /* Pre-splash: painted by the browser on the first frame, before Flutter
       loads. It is the app's splash itself (gradient + official brand block,
       same unit and ratios as CeffloBrandBlock), so the Flutter splash takes
       over with no visible change and no blank or white frame. */
    @font-face { font-family: 'CefManrope'; src: url('assets/assets/fonts/manrope/Manrope-Medium.ttf'); font-weight: 500; font-display: block; }
    /* Root = bottom stop of the pre-splash gradient, so the Android gesture /
       navigation area continues the screen from the first frame. The app then
       keeps it equal to each screen's bottom surface (bottom_surface_web.dart). */
    html, body { margin: 0; height: 100%; background: #0592EB; }
    #cef-presplash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg,#01265E 0%,#00378F 35%,#005CC4 70%,#0592EB 100%); z-index: 0; transition: opacity .3s ease; }
    #cef-presplash.gone { opacity: 0; pointer-events: none; }
    .cf-brand{--u:clamp(84px,min(27vw,14.25vh),128px);display:flex;flex-direction:column;align-items:center;color:rgba(255,255,255,.92)}
    .cf-sym,.cf-word{position:relative;overflow:hidden;flex:none}
    .cf-sym{width:calc(var(--u)*.822);height:var(--u)}
    .cf-word{width:calc(var(--u)*1.02);height:calc(var(--u)*.272);margin-top:calc(var(--u)*.37)}
    .cf-sym img,.cf-word img{position:absolute;left:50%;top:50%;height:auto;max-width:none}
    .cf-sym img{width:calc(var(--u)*1.783);transform:translate(-50%,-50%)}
    .cf-word img{width:calc(var(--u)*1.745);transform:translate(-49.1%,-50.4%)}
    .cf-label{margin-top:calc(var(--u)*.05);font:500 calc(var(--u)*.2)/1.2 CefManrope,system-ui,sans-serif;letter-spacing:.01em}
  </style>
</head>
<body>
  <div id="cef-presplash" aria-hidden="true"><div class="cf-brand"><span class="cf-sym"><img src="assets/assets/brand/cefflo-symbol.png" alt="" width="1024" height="1024"></span><span class="cf-word"><img src="assets/assets/brand/cefflo-wordmark.png" alt="" width="1024" height="1024"></span><span class="cf-label">Vendor</span></div></div>
  <script>
    // Same label as the Flutter splash for the Operator / Helper entry.
    (function () {
      var a = new URLSearchParams(location.search).get('access');
      var ms = false;
      try { ms = /ms/.test(localStorage.getItem('flutter.cefflo.ui_locale') || ''); } catch (e) {}
      var label = { operator: ms ? 'Akses Operator' : 'Operator Access', helper: ms ? 'Akses Pembantu' : 'Helper Access' }[a];
      if (label) document.querySelector('#cef-presplash .cf-label').textContent = label;
    })();
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('cef-presplash');
      if (el) { el.classList.add('gone'); setTimeout(function () { el.remove(); }, 320); }
    });
  </script>
  <!-- Measures env(safe-area-inset-bottom) for lib/core/safe_area_web.dart. -->
  <div id="cef-safe-area" aria-hidden="true" style="position:fixed;left:0;bottom:0;width:0;height:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
