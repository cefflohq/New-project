name: cefflo_vendor_mobile
description: "Cefflo Vendor Mobile — Flutter client wired to the canonical Cefflo backend (staging only)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cefflo_loader:
    path: ../../packages/cefflo_loader
  cefflo_phone:
    path: ../../packages/cefflo_phone
  cefflo_push:
    path: ../../packages/cefflo_push
  cefflo_server_messages:
    path: ../../packages/cefflo_server_messages
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  supabase_flutter: ^2.8.0
  lucide_icons_flutter: ^3.1.18
  # Call / WhatsApp contact actions (already resolved transitively via
  # supabase_flutter; declared because the UI now calls it directly).
  url_launcher: ^6.3.0
  # Encodes the invitation link for the Invite QR modal (pure Dart).
  qr: ^3.0.2
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  file_picker: ^13.1.0
  csv: ^8.0.0
  excel: ^4.0.6
  share_plus: ^13.3.0
  font_awesome_flutter: ^11.0.0
  package_info_plus: ^10.2.1
  audioplayers: ^6.8.1
  web: ^1.1.1
  flutter_map: ^8.3.2
  http: ^1.6.0
  latlong2: ^0.10.1
  geolocator: ^14.0.1
  google_sign_in: ^7.2.0
  camera: ^0.12.1
  image: ^4.3.0
  google_mlkit_text_recognition: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # D-35 canonical logo assets, byte-identical to
    # docs/cefflo/brand/assets/logo/ (SHA-256 verified on copy).
    - assets/brand/
    # Founder-supplied contact action artwork, used as delivered.
    - assets/icons/
    # Cefflo Signature Notification Sound (NOTIFICATION_EVENT_MATRIX §6).
    - assets/sounds/
  fonts:
    # Brand block label (surface name under the official logo), the same
    # face and weight as every other Cefflo surface's splash.
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
    # Primary Latin typeface (Inter, OFL-1.1, bundled locally -- no runtime
    # font downloading). Weights match the locked hierarchy: Regular for
    # supporting text, Medium for body, SemiBold for labels/buttons/
    # navigation/statuses, Bold for headings/card titles, ExtraBold for KPI
    # values only.
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.otf
          weight: 700
        - asset: assets/fonts/inter/Inter-ExtraBold.otf
          weight: 800
    # Multilingual fallback: Inter covers Latin only. Tamil is bundled (small);
    # Chinese uses the phone's own CJK font (Android/iOS ship one) instead of
    # a 24 MB bundled Noto Sans SC (Founder 2026-10-16: lighter APK).
    - family: Noto Sans Tamil
      fonts:
        - asset: assets/fonts/noto_sans_tamil/NotoSansTamil-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto_sans_tamil/NotoSansTamil-Bold.ttf
          weight: 700
