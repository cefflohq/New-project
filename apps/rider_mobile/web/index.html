<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CEFFLO Driver mobile application.">
  <meta name="theme-color" content="#0A6BE0">
  <!-- viewport-fit=cover: edge-to-edge on Android; the app adds the bottom
       inset itself (see #cef-safe-area below). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cefflo Driver">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cefflo Driver</title>
  <link rel="manifest" href="manifest.json">
<style>
    /* Pre-splash (Founder, 2026-10-01): shown by the browser before Flutter
       has loaded, instead of a blank white page. Removed on the first
       Flutter frame. */
    html, body { margin: 0; height: 100%; background: #01265E; }
    #cef-presplash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg,#01305F 0%,#0A6BE0 100%); z-index: 0; transition: opacity .25s ease; }
    #cef-presplash img { width: 132px; height: auto; }
    #cef-presplash.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body style="margin: 0; background: #FFFFFF;">
  <!-- Measures env(safe-area-inset-bottom) for lib/core/safe_area_web.dart. -->
  <div id="cef-safe-area" aria-hidden="true" style="position:fixed;left:0;bottom:0;width:0;height:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
