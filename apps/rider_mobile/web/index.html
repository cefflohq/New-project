<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CEFFLO Driver mobile application.">
  <meta name="theme-color" content="#0A6BE0">
  <!-- viewport-fit=cover: edge-to-edge on Android; the app adds the bottom
       inset itself (see #cef-safe-area below). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cefflo Driver">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cefflo Driver</title>
  <link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="loader/loader.css">
<style>
    /* Pre-splash: painted by the browser on the first frame, before Flutter
       loads. It is the app's splash itself (gradient + official brand block,
       same unit and ratios as CeffloBrandBlock), so the Flutter splash takes
       over with no visible change and no blank or white frame. */
    @font-face { font-family: 'CefManrope'; src: url('assets/assets/fonts/manrope/Manrope-Medium.ttf'); font-weight: 500; font-display: block; }
    /* Root = bottom stop of the pre-splash gradient, so the Android gesture /
       navigation area continues the screen from the first frame. The app then
       keeps it equal to each screen's bottom surface (bottom_surface_web.dart). */
    html, body { margin: 0; height: 100%; background: #0592EB; }
    #cef-presplash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg,#01265E 0%,#00378F 35%,#005CC4 70%,#0592EB 100%); z-index: 0; transition: opacity .3s ease; }
    #cef-presplash.gone { opacity: 0; pointer-events: none; }
    .cf-brand{--u:clamp(84px,min(27vw,14.25vh),128px);display:flex;flex-direction:column;align-items:center;color:rgba(255,255,255,.92)}
    .cf-sym,.cf-word{position:relative;overflow:hidden;flex:none}
    .cf-sym{width:calc(var(--u)*.822);height:var(--u)}
    .cf-word{width:calc(var(--u)*1.02);height:calc(var(--u)*.272);margin-top:calc(var(--u)*.37)}
    .cf-sym img,.cf-word img{position:absolute;left:50%;top:50%;height:auto;max-width:none}
    .cf-sym img{width:calc(var(--u)*1.783);transform:translate(-50%,-50%)}
    .cf-word img{width:calc(var(--u)*1.745);transform:translate(-49.1%,-50.4%)}
    .cf-label{margin-top:calc(var(--u)*.05);font:500 calc(var(--u)*.2)/1.2 CefManrope,system-ui,sans-serif;letter-spacing:.01em}
  </style>
</head>
<body>
  <div id="cef-presplash" style="flex-direction:column;gap:28px"><div class="cf-brand"><span class="cf-sym"><img src="assets/assets/brand/cefflo-symbol.png" alt="" width="1024" height="1024"></span><span class="cf-word"><img src="assets/assets/brand/cefflo-wordmark.png" alt="" width="1024" height="1024"></span><span class="cf-label">Driver</span></div><div class="cf-page-loader cf-page-loader--inline cf-on-blue" role="status" aria-live="polite" style="min-height:0;padding:0"><div class="cf-dots" aria-hidden="true"><i></i><i></i><i></i></div><p class="cf-loader-label">Memuatkan…</p></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('cef-presplash');
      if (el) { el.classList.add('gone'); setTimeout(function () { el.remove(); }, 320); }
    });
  </script>
  <!-- Measures env(safe-area-inset-bottom) for lib/core/safe_area_web.dart. -->
  <div id="cef-safe-area" aria-hidden="true" style="position:fixed;left:0;bottom:0;width:0;height:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
